name: trajectory-worker-job-factory-deploy-dev

on:
  push:
    branches:
      - develop
    paths:
      - trajectory-worker-job-factory/**
      - .github/workflows/trajectory-worker-job-factory-deploy-dev.yaml

# avoid possible race condition on multiple merges
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GCP auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '584.0.0'

      - name: Set up gcloud plugins
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Authorize kubectl CLI
        run: gcloud container clusters get-credentials contrails-gke-general --region us-east1

      # TEMPORARY: diagnose gke-gcloud-auth-plugin / config-helper crash; prints no secrets
      - name: Debug gcloud auth
        run: |
          grep PRETTY_NAME /etc/os-release
          echo "ImageVersion=$ImageVersion"
          which -a gcloud gke-gcloud-auth-plugin || true
          gcloud version || true
          gke-gcloud-auth-plugin --version || true
          env | grep -E '^(CLOUDSDK|GOOGLE)_' | sed 's/=.*/=<set>/' || true
          jq -r '"type=\(.type) has_private_key_id=\(has("private_key_id")) keys=\(keys)"' "$GOOGLE_APPLICATION_CREDENTIALS" || true
          gcloud auth list || true
          gcloud config list || true
          gcloud config config-helper --format=json --verbosity=debug > /dev/null || true
          kubectl version --client || true
          kubectl get ns default -o name || true

      - name: Authorize docker CLI
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: trajectory-worker-job-factory/
          push: true
          tags: |
            us-east1-docker.pkg.dev/contrails-301217/flights-pipeline/trajectory-worker-job-factory-dev:${{ github.sha }}
            us-east1-docker.pkg.dev/contrails-301217/flights-pipeline/trajectory-worker-job-factory-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy helm resources
        working-directory: trajectory-worker-job-factory/helm
        run: make deploy
        env:
          NAMESPACE: flights-pipeline-dev
          IMAGE: us-east1-docker.pkg.dev/contrails-301217/flights-pipeline/trajectory-worker-job-factory-dev:${{ github.sha }}
          LOG_LEVEL: INFO
          TWJD_SUBSCRIPTION_ID: projects/contrails-301217/subscriptions/dev-fp-twjd-ingress
          TRAJECTORY_CHUNK_TOPIC_ID: projects/contrails-301217/topics/dev-fp-gaia-trajectory-chunk
          REDIS_HOST: 10.231.195.4
          REDIS_PORT: 6379
